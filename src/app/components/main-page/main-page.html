<main class="main-page-container">
  <header class="header">
    <h1>Kalkulator Obligacji Skarbowych</h1>
    <p>Symulacja zysków dla polskich obligacji skarbowych</p>
  </header>

  <div class="controls-section">
    <div class="slider-container">
      <label for="global-investment">Kwota inwestycji: <strong>{{ investmentAmount() | number: '1.0-0' }}
          PLN</strong></label>
      <input id="global-investment" type="range" [min]="minInvestmentAmount" [max]="maxInvestmentAmount"
        [step]="investmentStep" [value]="investmentAmount()" (input)="onInvestmentInput($event)"
        class="global-slider" />
    </div>
  </div>

  <section class="bonds-list">
    @for (bond of bonds; track bond.type) {
    <app-bond-card [bond]="bond" [investmentAmount]="investmentAmount()"></app-bond-card>
    }
  </section>
</main>
